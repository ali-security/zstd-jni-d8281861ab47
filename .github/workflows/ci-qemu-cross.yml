name: "CI qemu cross"
on: [workflow_dispatch]
jobs:
    qemu-cross:
        strategy:
            matrix:
                include: [
                    { platform: s390x }
                ]
        runs-on: ubuntu-latest
        timeout-minutes: 55
        steps:
        - uses: actions/checkout@v3
        - uses: docker/setup-qemu-action@v2

        - name: qemu ${{ matrix.platform }} build and test
          uses: ./.github/actions/qemu-cross
          with:
            platform: ${{ matrix.platform }}
